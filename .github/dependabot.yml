version: 2
updates:
  # Expo pins native packages to the SDK, so only take patch/minor updates
  # automatically; SDK upgrades go through `npx expo install --fix`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'jest-expo', 'eslint-config-expo']

  - package-ecosystem: npm
    directory: /server/ai-proxy
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
