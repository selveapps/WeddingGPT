version: 2

# One pull request per ecosystem per month, not one per package per week.
# Each group below collects every update for its directory into a single PR
# (and a single branch), so the repository stays close to just `main`.
updates:
  # Expo pins React, React Native and the native modules to the SDK.
  # Dependabot does not know those pins and proposes versions the SDK does not
  # support, so they are ignored here: update them with `npx expo install --fix`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/*'
    groups:
      app:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /server/ai-proxy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      ai-proxy:
        patterns: ['*']

  # server/auth has no dependencies, so it has no entry here.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
